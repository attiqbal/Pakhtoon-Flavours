{% extends "owner/_layout.html" %}
{% block title %}Change password{% endblock %}
{% block main %}
<div class="topbar"><div><span class="eyebrow">Your account</span><h1>Change password</h1></div></div>
<p class="muted">You sign in as <b>{{ st.owner_login_email }}</b>. Choose a password only you know, at least 8 characters.</p>
<form method="post" action="/owner/settings/password" class="card" style="max-width:460px"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="from" value="/owner/password">
  <div class="field"><label for="current">Current password</label><input type="password" id="current" name="current" autocomplete="current-password" required></div>
  <div class="field"><label for="new">New password</label><input type="password" id="new" name="new" autocomplete="new-password" minlength="8" required></div>
  <div class="field"><label for="confirm">New password again</label><input type="password" id="confirm" name="confirm" autocomplete="new-password" minlength="8" required></div>
  <button class="btn primary">Save new password</button>
</form>
{% endblock %}
